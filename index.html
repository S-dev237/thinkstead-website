    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Thinkstead",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Windows 10, Windows 11, Debian, Ubuntu",

      }

    <!-- The remembered theme is applied before first paint, so a dark-mode visitor never sees a white flash. -->
    <script>
      try {
        var theme = localStorage.getItem("thinkstead.theme");
        if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    </script>

    <link rel="preload" as="image" href="./media/hero.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
